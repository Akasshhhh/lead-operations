services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-voice_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_ai_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voice_ai

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - voice_ai

  db-migrate:
    build:
      context: .
      dockerfile: services/lead-service/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-voice_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_ai_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voice_ai
    restart: "no"

  lead-service:
    build:
      context: .
      dockerfile: services/lead-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-voice_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_ai_dev_password}
      LEAD_SERVICE_AUTH_TOKEN: ${LEAD_SERVICE_AUTH_TOKEN:-local-lead-service-token}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8001/health', headers={'X-Service-Token': os.environ['LEAD_SERVICE_AUTH_TOKEN']}), timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - voice_ai

  conversation-service:
    build:
      context: .
      dockerfile: services/conversation-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LEAD_SERVICE_URL: http://lead-service:8001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-voice_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_ai_dev_password}
      LEAD_SERVICE_AUTH_TOKEN: ${LEAD_SERVICE_AUTH_TOKEN:-local-lead-service-token}
      CONVERSATION_SERVICE_TIMEOUT_SECONDS: ${CONVERSATION_SERVICE_TIMEOUT_SECONDS:-5}
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8002/health', headers={'X-Service-Token': os.environ['LEAD_SERVICE_AUTH_TOKEN']}), timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      lead-service:
        condition: service_healthy
    networks:
      - voice_ai

  event-relay:
    build:
      context: .
      dockerfile: workers/event-relay/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voice_ai}
      POSTGRES_USER: ${POSTGRES_USER:-voice_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_ai_dev_password}
      REDIS_URL: redis://redis:6379/0
      EVENT_MAX_ATTEMPTS: ${EVENT_MAX_ATTEMPTS:-5}
      EVENT_POLL_SECONDS: ${EVENT_POLL_SECONDS:-0.5}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - voice_ai

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      args:
        INSTALL_VOICE_RUNTIME: ${VOICE_RUNTIME_ENABLED:-0}
    environment:
      APP_ENV: ${APP_ENV:-local}
      LEAD_SERVICE_URL: http://lead-service:8001
      CONVERSATION_SERVICE_URL: http://conversation-service:8002
      LEAD_SERVICE_AUTH_TOKEN: ${LEAD_SERVICE_AUTH_TOKEN:-local-lead-service-token}
      LEAD_SERVICE_TIMEOUT_SECONDS: ${LEAD_SERVICE_TIMEOUT_SECONDS:-5}
      VOICE_RUNTIME_ENABLED: ${VOICE_RUNTIME_ENABLED:-0}
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-openai,openrouter}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
      LLM_ATTEMPT_TIMEOUT_SECONDS: ${LLM_ATTEMPT_TIMEOUT_SECONDS:-4}
      LLM_RETRY_DELAY_SECONDS: ${LLM_RETRY_DELAY_SECONDS:-0.1}
      LLM_FAILURE_THRESHOLD: ${LLM_FAILURE_THRESHOLD:-3}
      LLM_COOLDOWN_SECONDS: ${LLM_COOLDOWN_SECONDS:-15}
      SPEECH_MODE: ${SPEECH_MODE:-mock}
      STT_PROVIDERS: ${STT_PROVIDERS:-sarvam}
      TTS_PROVIDERS: ${TTS_PROVIDERS:-sarvam,rumik}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      RUMIK_API_KEY: ${RUMIK_API_KEY:-}
      SARVAM_TTS_VOICE: ${SARVAM_TTS_VOICE:-shubh}
      RUMIK_TTS_VOICE: ${RUMIK_TTS_VOICE:-siya}
      RUMIK_TTS_MODEL: ${RUMIK_TTS_MODEL:-mulberry}
      SPEECH_MAX_ATTEMPTS: ${SPEECH_MAX_ATTEMPTS:-2}
      SPEECH_ATTEMPT_TIMEOUT_SECONDS: ${SPEECH_ATTEMPT_TIMEOUT_SECONDS:-4}
      SPEECH_RETRY_DELAY_SECONDS: ${SPEECH_RETRY_DELAY_SECONDS:-0.1}
      SPEECH_FAILURE_THRESHOLD: ${SPEECH_FAILURE_THRESHOLD:-3}
      SPEECH_COOLDOWN_SECONDS: ${SPEECH_COOLDOWN_SECONDS:-15}
      DEMO_FAULTS_ENABLED: ${DEMO_FAULTS_ENABLED:-0}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 6
    depends_on:
      lead-service:
        condition: service_healthy
      conversation-service:
        condition: service_healthy
    networks:
      - voice_ai

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      GATEWAY_URL: http://api-gateway:8000
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - voice_ai

networks:
  voice_ai:
    name: voice_ai

volumes:
  postgres_data:
    name: voice_ai_postgres_data
  redis_data:
    name: voice_ai_redis_data
