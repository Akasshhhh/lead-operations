[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai-platform"
version = "0.1.0"
description = "Fault-tolerant AI voice lead qualification platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools]
packages = [
    "voice_platform_speech",
    "voice_platform_llm",
    "event_relay",
    "voice_platform_events",
    "lead_service",
    "conversation_service",
    "api_gateway",
    "voice_platform_contracts",
    "voice_platform_config",
    "voice_platform_db",
    "voice_platform_db.models",
]

[tool.setuptools.package-dir]
voice_platform_speech = "packages/speech/voice_platform_speech"
voice_platform_llm = "packages/llm/voice_platform_llm"
event_relay = "workers/event-relay/src/event_relay"
voice_platform_events = "packages/event-bus/voice_platform_events"
api_gateway = "apps/api-gateway/src/api_gateway"
voice_platform_contracts = "packages/contracts/voice_platform_contracts"
lead_service = "services/lead-service/src/lead_service"
conversation_service = "services/conversation-service/src/conversation_service"
voice_platform_config = "packages/configuration/voice_platform_config"
voice_platform_db = "packages/database/voice_platform_db"
"voice_platform_db.models" = "packages/database/voice_platform_db/models"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/speech",
    "packages/llm",
    "packages/event-bus",
    "workers/event-relay/src",
    "packages/configuration",
    "packages/database",
    "packages/contracts",
    "services/lead-service/src",
    "services/conversation-service/src",
    "apps/api-gateway/src",
]
addopts = "-ra"
markers = [
    "integration: requires a running PostgreSQL instance",
    "failure: validates controlled dependency failure behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"services/lead-service/src/lead_service/app.py" = ["B008"]
"apps/api-gateway/src/api_gateway/app.py" = ["B008"]
"services/conversation-service/src/conversation_service/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages",
    "services/lead-service/src",
    "services/conversation-service/src",
    "apps/api-gateway/src",
    "workers",
    "tests",
]
mypy_path = [
    "packages/speech",
    "packages/llm",
    "packages/event-bus",
    "workers/event-relay/src",
    "packages/configuration",
    "packages/database",
    "packages/contracts",
    "services/lead-service/src",
    "services/conversation-service/src",
    "apps/api-gateway/src",
]
